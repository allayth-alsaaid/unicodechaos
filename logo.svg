<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 96">
  <title>Unicode Chaos — logo lockup</title>
  <style>
    .word { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-weight: 800; font-size: 33px; letter-spacing: 0.5px; fill: #eceee8; }
    .tag { font-family: system-ui, "Segoe UI", Arial, sans-serif; font-weight: 600; font-size: 11.5px; letter-spacing: 2.5px; fill: #7dd3c0; }
    @media (prefers-color-scheme: light) {
      .word { fill: #1e201d; }
      .tag { fill: #0f766e; }
    }
  </style>
  <g transform="translate(4,4) scale(1.375)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#101210" stroke="#7dd3c0" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="#7dd3c0">
      <rect x="15" y="15" width="9" height="30" rx="2.5"/>
      <rect x="15" y="36" width="26" height="9" rx="2.5"/>
      <rect x="32" y="30" width="9" height="15" rx="2.5"/>
      <rect x="34" y="20" width="7" height="7" rx="1.5" opacity="0.9"/>
      <rect x="43" y="13" width="6" height="6" rx="1.5" opacity="0.6"/>
      <circle cx="46" cy="30" r="2.2" opacity="0.7"/>
      <circle cx="52" cy="22" r="3" opacity="0.45"/>
    </g>
  </g>
  <text class="word" x="108" y="48">Unicode Chaos</text>
  <text class="tag" x="110" y="72">MAXIMUM-DIVERSITY TEXT</text>
</svg>
